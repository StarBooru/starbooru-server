# Builds the server package. A tag (v0.1.0-beta.1) puts it in a draft release; running it
# by hand only builds. The image is built by image.yml from the same tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # The version the server shows. By hand this says the branch, like the filename.
  STARBOORU_VERSION: ${{ github.ref_name }}

jobs:
  server:
    name: Server
    # The oldest supported Ubuntu, so the binary runs on any newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p starbooru-server
      - name: Pack
        run: |
          name="starbooru-server-${GITHUB_REF_NAME#v}-linux-x86_64"
          mkdir -p "$name" out
          cp target/release/starbooru-server .env.example LICENSE ATTRIBUTION.md "$name/"
          tar -czf "out/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Named, so it lands in artifacts/server/; a lone artifact otherwise lands in artifacts/.
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: artifacts/server
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --verify-tag \
            --title "StarBooru server ${GITHUB_REF_NAME#v}" --notes "Draft: the notes come next." \
            artifacts/server/*
