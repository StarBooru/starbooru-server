name: Bug report
description: Something in the server doesn't work as it should. Bugs in an app go to its own repository.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /api/v1/posts with a 30 MB PNG
        2. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run the server?
      options:
        - Docker image
        - Server package
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: `GET /api/v1/info` answers with the server version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, passwords and addresses you'd rather keep private. Please don't attach personal pictures.
      render: text
